name: Build & push OIDC image

on:
  push:
    branches: [oidc]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/docuseal-oidc
  UPSTREAM: docusealco/docuseal

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oidc
          fetch-depth: 0

      - name: Sync with upstream
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/${{ env.UPSTREAM }}.git || true
          LATEST_TAG=$(git ls-remote --tags upstream 'refs/tags/*' | grep -v '{}' | tail -1 | sed 's/.*refs\/tags\///')
          git fetch upstream "$LATEST_TAG"
          if git rebase "FETCH_HEAD"; then
            git push origin oidc --force-with-lease
          else
            git rebase --abort
            echo "::warning::Rebase failed — manual intervention needed"
          fi

      - name: Lowercase image name
        run: echo "IMAGE_LC=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Detect version
        id: version
        run: |
          # Filtrer les tags avec slash (ex: oidc-base/2.5.0) qui ne sont pas
          # des tags Docker valides. Ne garder que v1.2.3 / 1.2.3 style.
          VERSION=$(git tag --list 'v*.*.*' '[0-9]*.*.*' --sort=-version:refname 2>/dev/null | head -1 | sed 's/^v//')
          [ -z "$VERSION" ] && VERSION="latest"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.oidc
          target: docuseal-oidc
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:latest
